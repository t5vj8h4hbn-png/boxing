<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Johnny B - Boxing Coach</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #080808;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .card-container {
            width: 100%;
            max-width: 400px;
            background: #111111;
            border: 1px solid #2a0808;
            border-radius: 28px;
            padding: 30px 20px;
            box-shadow: 0 20px 40px rgba(180, 0, 0, 0.25);
            text-align: center;
        }

        .profile-img-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 20px auto;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #d61c1c;
            box-shadow: 0 0 20px rgba(214, 28, 28, 0.5);
        }

        .tagline {
            color: #d61c1c;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .name {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .title {
            font-size: 14px;
            color: #a1a1a1;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .badge-veteran {
            display: inline-block;
            background: #1c1a14;
            border: 1px solid #c5a059;
            color: #c5a059;
            font-size: 11px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .btn-red {
            background: linear-gradient(135deg, #e61c1c 0%, #8a0000 100%);
            color: #ffffff;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(214, 28, 28, 0.4);
        }

        .btn-red:active {
            transform: scale(0.98);
        }

        .btn-dark {
            background-color: #1f1f1f;
            color: #ffffff;
            border: 1px solid #333333;
        }

        .btn-dark:active {
            background-color: #2a2a2a;
            transform: scale(0.98);
        }

        .footer-text {
            margin-top: 25px;
            font-size: 11px;
            color: #666666;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- الصورة الشخصية -->
        <div class="profile-img-container">
            <img src="c2e7bff3-caf1-4f3c-96c6-b9089df3b8f9.jpeg" alt="Coach Johnny B" class="profile-img">
        </div>

        <p class="tagline">Real Coach • Real Results</p>
        <h1 class="name">COACH JOHNNY B</h1>
        <p class="title">Boxing Coach</p>

        <!-- وسام الجيش الأمريكي -->
        <div class="badge-veteran">
            ★ U.S. ARMY VETERAN
        </div>

        <!-- الأزرار التفاعلية -->
        <div class="links-container">
            
            <a href="https://wa.me/17024691179?text=Hi%20Coach%20Johnny,%20I'm%20interested%20in%20Boxing%20Training" target="_blank" class="btn btn-red">
                <i class="fa-solid fa-dumbbell"></i> BOOK TRAINING SESSION
            </a>

            <a href="https://www.instagram.com/johnny_b1scu1ts" target="_blank" class="btn btn-dark">
                <i class="fa-brands fa-instagram"></i> Instagram (@johnny_b1scu1ts)
            </a>

            <a href="tel:+17024691179" class="btn btn-dark">
                <i class="fa-solid fa-phone"></i> Call Coach Johnny
            </a>

        </div>

        <div class="footer-text">
            BUILDING CHAMPIONS INSIDE & OUT
        </div>
    </div>

</body>
</html>
